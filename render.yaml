services:
  - type: web
    name: simulador-molecular
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      # Billing remains disabled until persistent storage and Stripe are configured.
      - key: DEEPHARMA_DB_PATH
        sync: false
      - key: ENABLE_BILLING
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_DEEPLATINUM
        sync: false
      - key: STRIPE_PRICE_DEEPHARMAX
        sync: false
      - key: DEEPHARMA_PUBLIC_URL
        sync: false
